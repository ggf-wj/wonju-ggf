backend:
  name: git-gateway
  branch: main

# Netlify Identity 로그인 후 이 관리자 페이지(/admin)에서
# 콘텐츠를 수정하면 실제 웹사이트에 반영됩니다.

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "news"
    label: "협회 소식"
    files:
      - name: "news"
        label: "소식 목록"
        file: "data/news.json"
        fields:
          - name: "items"
            label: "소식 항목"
            widget: "list"
            label_singular: "소식"
            summary: "{{date}} - {{title}}"
            fields:
              - { name: "date", label: "날짜 (예: 2026.09)", widget: "string" }
              - { name: "title", label: "제목", widget: "string" }
              - { name: "link", label: "링크 (선택, 없으면 # 입력)", widget: "string", default: "#" }

  - name: "board"
    label: "자유게시판"
    files:
      - name: "board"
        label: "게시글 목록"
        file: "data/board.json"
        fields:
          - name: "items"
            label: "게시글"
            widget: "list"
            label_singular: "게시글"
            summary: "{{date}} - {{author}}"
            fields:
              - { name: "date", label: "날짜 (예: 2026.09)", widget: "string" }
              - { name: "author", label: "작성자명", widget: "string" }
              - { name: "body", label: "내용", widget: "text" }

  - name: "pending"
    label: "🔔 대기중인 신청"
    files:
      - name: "pending-board"
        label: "대기중인 게시글 신청"
        file: "data/pending-board.json"
        fields:
          - name: "items"
            label: "신청 목록"
            widget: "list"
            label_singular: "신청"
            summary: "{{date}} - {{author}}"
            fields:
              - { name: "date", label: "날짜", widget: "string" }
              - { name: "author", label: "작성자명", widget: "string" }
              - { name: "email", label: "이메일", widget: "string", required: false }
              - { name: "body", label: "내용", widget: "text" }
      - name: "pending-members"
        label: "대기중인 회원가입 신청"
        file: "data/pending-members.json"
        fields:
          - name: "items"
            label: "신청 목록"
            widget: "list"
            label_singular: "신청"
            summary: "{{date}} - {{name}}"
            fields:
              - { name: "date", label: "날짜", widget: "string" }
              - { name: "name", label: "이름", widget: "string" }
              - { name: "phone", label: "연락처", widget: "string" }
              - { name: "email", label: "이메일", widget: "string", required: false }
              - { name: "address", label: "주소", widget: "string", required: false }
              - { name: "message", label: "가입 인사", widget: "text", required: false }
