<main>

  <section class="page-hero">
    <div class="container">
      <h1>자유게시판 글쓰기</h1>
      <p>남겨주신 글은 관리자 확인 후 게시판에 게시됩니다. 보통 1~2일 내 반영됩니다.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="form-card">
        <form
          id="boardForm"
          data-submit-type="board">
          <p class="honeypot-field">
            <label>이 항목은 채우지 마세요: <input name="botField" tabindex="-1" autocomplete="off"></label>
          </p>

          <div class="field">
            <label for="postName">이름(닉네임)<span class="req">*</span></label>
            <input type="text" id="postName" name="name" required maxlength="40">
          </div>

          <div class="field">
            <label for="postEmail">이메일 (선택, 답변이 필요할 때만)</label>
            <input type="email" id="postEmail" name="email" maxlength="120">
          </div>

          <div class="field">
            <label for="postBody">내용<span class="req">*</span></label>
            <textarea id="postBody" name="message" required maxlength="1000"></textarea>
          </div>

          <div class="field">
            <label class="field-check">
              <input type="checkbox" required>
              <span>작성한 글은 관리자 확인 후 게시판에 공개될 수 있음을 확인했습니다.<span class="req">*</span></span>
            </label>
          </div>

          <button type="submit" class="btn btn--primary form-submit">등록 요청하기</button>
        </form>
        <div id="formMessage" class="form-message" hidden></div>
      </div>
    </div>
  </section>

</main>
